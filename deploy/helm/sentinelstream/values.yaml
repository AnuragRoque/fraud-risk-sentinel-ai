replicaCount: 2

image:
  repository: sentinelstream
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 75

config:
  kafkaBootstrapServers: "sentinel-kafka:9092"
  kafkaRawTopic: "transactions.raw"
  kafkaAlertTopic: "fraud.alerts"
  riskHighThreshold: "0.70"
  riskMediumThreshold: "0.40"
  logLevel: "INFO"
