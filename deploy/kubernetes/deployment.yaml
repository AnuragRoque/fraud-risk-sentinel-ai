apiVersion: apps/v1
kind: Deployment
metadata:
  name: sentinelstream-app
  labels:
    app.kubernetes.io/name: sentinelstream
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: sentinelstream
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sentinelstream
    spec:
      containers:
        - name: sentinelstream
          image: sentinelstream:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http-metrics
          envFrom:
            - configMapRef:
                name: sentinelstream-config
            - secretRef:
                name: sentinelstream-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
